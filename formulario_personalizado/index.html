<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas de Computadoras</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="formulario" class="formulario">
        <h2>Registro de Ventas</h2>
        <p>Ing. Mauricio Alberto Alvarez Aspeitia</p>

        <form>
            <label>Modelo de computadora:</label>
            <input id="modelo" type="text" placeholder="Ejemplo: Lenovo ThinkPad">

            <label>Precio de venta:</label>
            <input id="precio" type="number" placeholder="Escribe el precio">

            <label>Nombre del cliente:</label>
            <input id="nombre" type="text" placeholder="Escribe el nombre">

            <label>Teléfono del cliente:</label>
            <input id="telefono" type="text" placeholder="Escribe el teléfono">

            <button type="submit">Guardar venta</button>
        </form>
    </div>

    <script src="script.js"></script>

</body>
</html>
